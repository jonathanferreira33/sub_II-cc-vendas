apiVersion: apps/v1
kind: Deployment
metadata:
  name: h2-db
spec:
  selector:
    matchLabels:
      app: h2-db
  template:
    metadata:
      labels:
        app: h2-db
    spec:
      containers:
        - name: h2
          image: buildo/h2-database
          ports:
            - containerPort: 9092
            - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: h2-service
spec:
  selector:
    app: h2-db
  ports:
    - name: tcp
      port: 9092
      targetPort: 9092